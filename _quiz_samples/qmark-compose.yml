version: 1.0.0
name: Quiz 1
# type: multiple-choice | multiple-select | boolean | fill-blank | short-answer | matching | ordering
# photo and photo_anchor are optional
sections:
  - sectionType: Multiple choice
    goal: Test knowledge of European capital cities.
    instructions: Select the correct answer from the options provided.
    questions:
      - question: What is the capital of France?
        answer: Paris
        photo: https://t4.ftcdn.net/jpg/00/62/18/79/360_F_62187902_w50dxLCzgZjysgW54s8l2lExRVrelETY.jpg
        photo_anchor: top-left
        theme: France
        difficulty: easy
        type: multiple-choice
        options:
          - Paris
          - London
          - Berlin

      - question: What is the capital of Italy?
        answer: Rome
        theme: Italy
        difficulty: easy
        type: multiple-choice
        options:
          - Rome
          - Milan
          - Naples

  - sectionType: Boolean
    goal: Test knowledge of European capital cities.
    instructions: Decide whether each statement is true or false.
    questions:
      - question: Berlin is the capital of Germany.
        answer: true
        photo: https://images.unsplash.com/photo-1663493955721-110e7e1ae36c?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8Z2VybWFuJTIwZmxhZ3xlbnwwfHwwfHx8MA%3D%3D
        photo_anchor: top-left
        theme: Germany
        difficulty: easy
        type: boolean

      - question: Madrid is the capital of Portugal.
        answer: false
        theme: Portugal
        difficulty: easy
        type: boolean

  - sectionType: Multiple select
    goal: Test knowledge of cities in Italy and Spain.
    instructions: Select all correct answers from the options provided.
    questions:
      - question: Which cities are in Italy?
        answer:
          - Rome
          - Milan
        photo: https://img.magnific.com/free-psd/isolated-italy-flag-design_23-2151868272.jpg?semt=ais_hybrid&w=740&q=80
        photo_anchor: top-left
        theme: Italy
        difficulty: easy
        type: multiple-select
        options:
          - Rome
          - Milan
          - Madrid

      - question: Which cities are in Spain?
        answer:
          - Madrid
          - Barcelona
        theme: Spain
        difficulty: easy
        type: multiple-select
        options:
          - Madrid
          - Barcelona
          - Lisbon

  - sectionType: Fill in the blank
    goal: Test recall of European capital cities.
    instructions: Fill in the blank with the correct word.
    questions:
      - question: The capital of Italy is ____.
        answer: Rome
        photo: https://img.magnific.com/free-psd/isolated-italy-flag-design_23-2151868272.jpg?semt=ais_hybrid&w=740&q=80
        photo_anchor: top-left
        theme: Italy
        difficulty: easy
        type: fill-blank

      - question: The capital of France is ____.
        answer: Paris
        theme: France
        difficulty: easy
        type: fill-blank

  - sectionType: Short answer
    goal: Test recall of European capital cities.
    instructions: Type the correct answer.
    questions:
      - question: What is the capital of Spain?
        answer: Madrid
        photo: https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkp1kp0nOaEWhOROHQYrnIpUssyNtqu0MHiZxK1W6lWCb7jhqA_YBH2iY&s=10
        photo_anchor: top-left
        theme: Spain
        difficulty: easy
        type: short-answer

      - question: What is the capital of Portugal?
        answer: Lisbon
        theme: Portugal
        difficulty: easy
        type: short-answer

  - sectionType: Matching
    goal: Test pairing of countries and capital cities.
    instructions: Match each country to its capital.
    questions:
      - question: Match each country to its capital.
        answer:
          France: Paris
          Germany: Berlin
          Italy: Rome
        theme: Europe
        difficulty: medium
        type: matching
        left:
          - France
          - Germany
          - Italy
        right:
          - Paris
          - Berlin
          - Rome

      - question: Match each country to its capital.
        answer:
          Spain: Madrid
          Portugal: Lisbon
          Greece: Athens
        theme: Europe
        difficulty: medium
        type: matching
        left:
          - Spain
          - Portugal
          - Greece
        right:
          - Madrid
          - Lisbon
          - Athens

  - sectionType: Ordering
    goal: Test geographic order of European capital cities.
    instructions: Put the items in the correct order.
    questions:
      - question: Order these capitals from west to east.
        answer:
          - Lisbon
          - Paris
          - Berlin
        theme: Europe
        difficulty: medium
        type: ordering
        options:
          - Paris
          - Berlin
          - Lisbon

      - question: Order these capitals from north to south.
        answer:
          - Oslo
          - Berlin
          - Rome
        theme: Europe
        difficulty: medium
        type: ordering
        options:
          - Rome
          - Oslo
          - Berlin
