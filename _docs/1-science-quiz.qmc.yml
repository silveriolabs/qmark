version: 1.0.0
name: Simple Science Quiz
sections:
  - sectionType: General science
    instructions: Answer each question.
    goal: Check basic science facts.
    questions:
      - question: What planet is known as the Red Planet?
        type: multiple-choice
        difficulty: easy
        theme: Astronomy
        options:
          - Mars
          - Venus
          - Jupiter
        answer: Mars

      - question: Water freezes at 0 degrees Celsius.
        type: boolean
        difficulty: easy
        theme: Chemistry
        answer: true

      - question: The chemical symbol for gold is ____.
        type: fill-blank
        difficulty: easy
        theme: Chemistry
        answer: Au
